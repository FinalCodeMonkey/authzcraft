server.port=18080

# RBAC 主体存储模式。AUTHZCRAFT 表示人员、组织、岗位、角色、用户组和成员关系均实时读写 AuthzCraft 主体域；LOCAL 表示读取本地主体/成员表。
authzcraft.demo-oa.rbac.storage-mode=AUTHZCRAFT

# 是否启用 AuthzCraft PEP Starter。true 表示注册 MyBatis 数据权限拦截器。
authzcraft.pep.enabled=true
# AuthzCraft 中心服务地址。PEP 会调用该地址下的 PDP 数据权限计划接口。
authzcraft.pep.center-base-url=http://localhost:8088
# 租户标识，必须与中心侧资源、策略、授权和主体上下文数据一致。
authzcraft.pep.tenant-key=platform
# 接入应用标识，必须与 authzcraft_relation_resource、authzcraft_access_path 等中心表的 app_key 一致。
authzcraft.pep.app-key=authzcraft-demo-oa
# 请求主体来源。HEADER 表示从 HTTP Header 动态读取当前访问人。
authzcraft.pep.requester-source=HEADER
# 默认请求主体类型。Header 未传 requester-kind 时使用该默认值。
authzcraft.pep.requester-kind=USER
# 动态请求主体类型 Header 名称。
authzcraft.pep.requester-kind-header=X-AuthzCraft-Requester-Kind
# 动态请求主体标识 Header 名称。该 Header 缺失时 PEP 会拒绝请求。
authzcraft.pep.requester-key-header=X-AuthzCraft-Requester-Key
# 权限计划请求的环境标识，用于区分测试、生产等策略环境。
authzcraft.pep.environment=TEST
# PEP 异常处理模式。FAIL_CLOSE 表示权限计划或 SQL 改写异常时拒绝访问；生产环境推荐该值。
authzcraft.pep.failure-mode=FAIL_CLOSE
# 是否把 decisionKey、planDecision、resourceKey 等调试信息写入 HTTP 响应 Header。demo 环境打开，生产环境建议关闭。
authzcraft.pep.observability.response-headers-enabled=true
# 是否输出 PEP 执行日志。日志只记录决策元信息和参数数量，不输出敏感参数明文或完整改写 SQL。
authzcraft.pep.observability.execution-log-enabled=true

